apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-deployment
  namespace: project

spec:
  replicas: 2

  selector:
    matchLabels:
      app: producer-app

  template:
    metadata:
      labels:
        app: producer-app

    spec:
      initContainers:

        # 1. MySQL 준비 대기
        - name: wait-for-mysql
          image: mysql:8.0

          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD

          command:
            - sh
            - -c
            - |
              timeout -k 5s 600s sh -c '
                until mysql --protocol=TCP \
                  --host=mysql \
                  --port=3306 \
                  --user=root \
                  --database=cqrs \
                  --connect-timeout=3 \
                  --execute="SELECT 1"; do
                  echo "Waiting for MySQL. Retrying in 5s..."
                  sleep 5
                done
              '

              result=$?

              if [ "$result" -eq 0 ]; then
                echo "MySQL ready."
                exit 0
              fi

              echo "MySQL wait failed or timed out. exit_code=${result}"
              exit 1


        # 2. Kafka 준비 대기
        - name: wait-for-kafka
          image: apache/kafka:4.3.1

          command:
            - sh
            - -c
            - |
              count=0

              until /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server kafka:9092 \
                >/dev/null 2>&1
              do
                count=$((count + 1))

                if [ "$count" -ge 120 ]; then
                  echo "Kafka wait timed out."
                  exit 1
                fi

                echo "Waiting for Kafka. Retrying in 5s..."
                sleep 5
              done

              echo "Kafka ready."
              exit 0


      containers:
        - name: producer-container
          image: gyueon/testproducer:readiness-v3

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: producer-configmap

          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD


          livenessProbe:
            httpGet:
              path: /health/app
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1


          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1


          startupProbe:
            httpGet:
              path: /health/app
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
            successThreshold: 1
