name: Producer CI

on:
  push:
    branches:
      - main
    paths:
      - "producer/**"
      - ".github/workflows/producer-ci.yaml"

  pull_request:
    branches:
      - main
    paths:
      - "producer/**"
      - ".github/workflows/producer-ci.yaml"

permissions:
  contents: read

jobs:
  producer-ci:
    name: Producer 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Producer 빌드 (테스트 제외)
        working-directory: producer
        run: |
          chmod +x gradlew
          ./gradlew build -x test --no-daemon

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: Docker Hub 로그인
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Producer 이미지 빌드 및 Push
        uses: docker/build-push-action@v7
        with:
          context: ./producer
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: gyueon/testproducer:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-manifest:
    name: Producer 매니페스트 업데이트
    needs: producer-ci

    permissions:
      contents: write

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    concurrency:
      group: main-manifest-update
      queue: max

    steps:
      - name: Producer 매니페스트 업데이트 시작
        run: echo "Producer 매니페스트 업데이트를 시작합니다."

      - name: 최신 main 브랜치 Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Kustomize 설치
        run: |
          curl -fsSL \
            "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.8.1

          sudo install -m 0755 kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Producer 이미지 태그 변경
        working-directory: kubernetes/overlays/local
        run: |
          kustomize edit set image \
            gyueon/testproducer=gyueon/testproducer:sha-${{ github.sha }}

      - name: Kustomize 렌더링 결과 검증
        working-directory: kubernetes/overlays/local
        run: |
          kustomize build .

      - name: Producer 매니페스트 Commit 및 Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add kubernetes/overlays/local/kustomization.yaml

          if git diff --cached --quiet; then
            echo "변경된 매니페스트가 없습니다."
            exit 0
          fi

          git commit \
            -m "chore: update producer image to sha-${{ github.sha }}"

          git push origin main